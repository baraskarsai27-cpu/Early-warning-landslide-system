<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Landslide Live Dashboard</title>

    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            background: #f4f6f9;
            margin: 0;
            padding: 15px;
        }

        .mobile-shell {
            max-width: 420px;
            margin: 15px auto;
            padding: 25px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        .status-header {
            font-size: 1.8rem;
            font-weight: bold;
            margin: 20px 0;
            padding: 20px;
            border-radius: 10px;
            color: white;
        }

        .safe {
            background-color: #2ecc71;
        }

        .danger {
            background-color: #e74c3c;
            animation: screen-flash 0.8s infinite;
        }

        @keyframes screen-flash {
            0% { background-color: #e74c3c; }
            50% { background-color: #c0392b; }
            100% { background-color: #e74c3c; }
        }

        .telemetry-logs {
            text-align: left;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 5px solid #bdc3c7;
            font-size: 1rem;
            line-height: 1.6;
        }

        .danger-border {
            border-left: 5px solid #e74c3c;
        }

        .btn-audio {
            background: #e67e22;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1.1rem;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 15px;
            width: 100%;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="mobile-shell">

    <h2>🌍 Landslide Monitor</h2>

    <button class="btn-audio" onclick="unlockMobileSpeaker()">
        🔊 Enable Phone Audio Sirens
    </button>

    <div id="statusAlert" class="status-header safe">
        SYNCHRONIZING...
    </div>

    <div class="telemetry-logs" id="logsDisplay">
        <p>🔄 Connecting to ThingSpeak...</p>
    </div>

</div>

<script>

const channelID = "3456662";

const url =
    `https://api.thingspeak.com/channels/${channelID}/feeds/last.json`;

let audioCtx = null;
let sirenInterval = null;


/* AUDIO INITIALIZATION */

function unlockMobileSpeaker() {

    if (!audioCtx) {

        audioCtx =
            new (window.AudioContext || window.webkitAudioContext)();

        alert("Phone audio system enabled!");

    }

}


/* PHONE SIREN */

function triggerPhoneSiren() {

    if (!audioCtx) return;

    const oscillator = audioCtx.createOscillator();
    const ampNode = audioCtx.createGain();

    oscillator.type = "sawtooth";

    oscillator.frequency.setValueAtTime(
        950,
        audioCtx.currentTime
    );

    oscillator.frequency.linearRampToValueAtTime(
        480,
        audioCtx.currentTime + 0.35
    );

    ampNode.gain.setValueAtTime(
        0.25,
        audioCtx.currentTime
    );

    ampNode.gain.exponentialRampToValueAtTime(
        0.01,
        audioCtx.currentTime + 0.35
    );

    oscillator.connect(ampNode);
    ampNode.connect(audioCtx.destination);

    oscillator.start();

    oscillator.stop(
        audioCtx.currentTime + 0.35
    );

}


/* THINGSPEAK CONNECTION */

async function syncSystemState() {

    const statusAlert =
        document.getElementById("statusAlert");

    const logsDisplay =
        document.getElementById("logsDisplay");


    try {

        statusAlert.innerText =
            "🔄 CONNECTING TO THINGSPEAK...";

        logsDisplay.innerHTML =
            "<strong>Requesting latest sensor data...</strong>";


        const response = await fetch(url, {
            cache: "no-store"
        });


        if (!response.ok) {

            throw new Error(
                "HTTP Error: " + response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "ThingSpeak data:",
            data
        );


        const distance =
            parseFloat(data.field1);

        const moisture =
            parseFloat(data.field2);

        const field3 =
            data.field3;


        if (
            isNaN(distance) ||
            isNaN(moisture)
        ) {

            throw new Error(
                "Field 1 or Field 2 contains no valid data"
            );

        }


        /* DANGER CONDITION */

        if (
    !isNaN(distance) &&
    !isNaN(moisture) &&
    distance > 0 &&
    moisture > 0 &&
    (distance < 70 || moisture < 1500)
    ) {

            statusAlert.innerText =
                "🚨 DANGER: EVACUATE";

            statusAlert.className =
                "status-header danger";

            logsDisplay.className =
                "telemetry-logs danger-border";


            logsDisplay.innerHTML = `
                <strong>⚠️ LANDSLIDE WARNING</strong><br><br>

                • Sensor Distance: ${distance} cm<br>

                • Soil Moisture: ${moisture}<br>

                • Field 3: ${field3}<br><br>

                • Last Update: ${data.created_at}
            `;


            if (!sirenInterval) {

                sirenInterval =
                    setInterval(
                        triggerPhoneSiren,
                        450
                    );

            }

        }


        /* SAFE CONDITION */

        else {

            statusAlert.innerText =
                "✅ SYSTEM SAFE";

            statusAlert.className =
                "status-header safe";

            logsDisplay.className =
                "telemetry-logs";


            logsDisplay.innerHTML = `
                <strong>📡 LIVE SENSOR DATA</strong><br><br>

                • Sensor Distance: ${distance} cm<br>

                • Soil Moisture: ${moisture}<br>

                • Field 3: ${field3}<br><br>

                • Last Update: ${data.created_at}<br>

                • Status: All alarms silent.
            `;


            if (sirenInterval) {

                clearInterval(sirenInterval);

                sirenInterval = null;

            }

        }


    }

    catch (err) {

        console.error(
            "ThingSpeak connection error:",
            err
        );


        statusAlert.innerText =
            "⚠️ CONNECTION LOST";

        statusAlert.className =
            "status-header danger";


        logsDisplay.className =
            "telemetry-logs danger-border";


        logsDisplay.innerHTML = `
            <strong>❌ CONNECTION ERROR</strong><br><br>

            ${err.name}: ${err.message}<br><br>

            Channel ID: ${channelID}
        `;

    }

}


/* START SYSTEM */

syncSystemState();

setInterval(
    syncSystemState,
    15000
);

</script>

</body>
</html>
